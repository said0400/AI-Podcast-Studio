[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-podcast-studio"
version = "0.1.0"
description = "Offline-first layered cartoon podcast rendering pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "AI Podcast Studio contributors"}]
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "soundfile>=0.12,<1",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "psutil>=5.9,<8"]
neural = [
  "torch>=2.2,<3",
  "speechbrain>=1.0,<2",
  "silero-vad>=5,<7",
  "scipy>=1.11,<2",
]

[project.scripts]
ai-podcast-studio = "ai_podcast_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_podcast_studio = ["project.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
