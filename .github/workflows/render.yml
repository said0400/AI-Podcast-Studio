name: Render cartoon podcast

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline mode
        type: choice
        required: true
        default: quality_check
        options:
          - quality_check
          - preview
          - full_render
      audio_path:
        description: Audio path inside the checked-out repository; never commit private recordings to a public repo
        type: string
        required: true
        default: input/audio/episode.wav
      project_path:
        description: Project JSON path inside the checked-out repository
        type: string
        required: true
        default: input/project.json
      publish_release:
        description: Publish the finished episode to a public GitHub Release (full_render only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and tests
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Validate input paths
        env:
          AUDIO_PATH: ${{ inputs.audio_path }}
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          test -f "$AUDIO_PATH" || { echo "Missing audio: $AUDIO_PATH"; exit 2; }
          test -f "$PROJECT_PATH" || { echo "Missing project JSON: $PROJECT_PATH"; exit 2; }
      - name: Run tests
        run: pytest
      - name: Quality check
        if: ${{ inputs.mode == 'quality_check' }}
        env:
          AUDIO_PATH: ${{ inputs.audio_path }}
          PROJECT_PATH: ${{ inputs.project_path }}
        run: >-
          ai-podcast-studio quality-check
          --audio "$AUDIO_PATH" --project "$PROJECT_PATH"
      - name: Preview render
        if: ${{ inputs.mode == 'preview' }}
        env:
          AUDIO_PATH: ${{ inputs.audio_path }}
          PROJECT_PATH: ${{ inputs.project_path }}
        run: >-
          ai-podcast-studio preview --audio "$AUDIO_PATH" --project "$PROJECT_PATH"
      - name: Full render
        if: ${{ inputs.mode == 'full_render' }}
        env:
          AUDIO_PATH: ${{ inputs.audio_path }}
          PROJECT_PATH: ${{ inputs.project_path }}
        run: >-
          ai-podcast-studio full-render --audio "$AUDIO_PATH" --project "$PROJECT_PATH"
      - name: Upload output and reports for retrieval
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: podcast-output-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            output/
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: render
    if: ${{ success() && inputs.mode == 'full_render' && inputs.publish_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download rendered episode
        uses: actions/download-artifact@v4
        with:
          name: podcast-output-${{ github.run_number }}-${{ github.run_attempt }}
          path: output
      - name: Publish episode to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: episode-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          test -f output/episode.mp4 || { echo "Full-render MP4 missing"; exit 2; }
          gh release create "$TAG" output/episode.mp4 \
            --title "Podcast episode ${{ github.run_number }}" \
            --notes "Generated by the AI Podcast Studio workflow. This release is public." \
            --target "$GITHUB_SHA"
